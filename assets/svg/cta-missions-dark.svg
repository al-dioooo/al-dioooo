<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 302 56" width="302" height="56" role="img" aria-label="View all mission records at al.is-a.dev/work">
  <title>View all mission records at al.is-a.dev/work</title>
  <style>
    
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes boot { 0% { opacity: 0; } 12% { opacity: 1; } 22% { opacity: .15; } 38% { opacity: 1; } 52% { opacity: .4; } 62%, 100% { opacity: 1; } }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 60% { opacity: 1; } 80% { opacity: .2; } 100% { opacity: 1; } }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes sweep { 0%, 6% { opacity: 1; } 7%, 100% { opacity: 0; } }
    .rise { animation: rise .55s cubic-bezier(.2, .7, .2, 1) both; }
    .fade { animation: fade .6s ease-out both; }
    .boot { animation: boot .9s steps(1, end) both; }
    .blink { animation: blink 1.1s steps(1, end) infinite; }
    .pulse { animation: pulse 1.6s linear infinite; }
    .draw { stroke-dasharray: 1; animation: draw 1.1s cubic-bezier(.6, 0, .2, 1) both; }
    .sweep { opacity: 0; animation: sweep 8s steps(1, end) infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .sweep { opacity: 0; } }
  </style>
  <defs>
    <pattern id="gridMinor" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#A8A29E" stroke-opacity=".05"/></pattern>
    <pattern id="gridMajor" x="2.5" y="-27.5" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#A8A29E" stroke-opacity=".1"/><path d="M-2.5 0h5M0 -2.5v5" stroke="#A8A29E" stroke-opacity=".2"/></pattern>
  </defs>
  <clipPath id="paper"><rect x="3" y="3" width="290" height="44"/></clipPath>
  <rect x="8" y="8" width="290" height="44" fill="#0C0A09" stroke="#E7E5E4" stroke-width="2"/>
  <rect x="3" y="3" width="290" height="44" fill="#1C1917"/>
  <rect x="3" y="3" width="290" height="44" fill="url(#gridMinor)"/>
  <rect x="3" y="3" width="290" height="44" fill="url(#gridMajor)"/>
  
  <rect x="4" y="4" width="288" height="42" fill="none" stroke="#E7E5E4" stroke-width="2"/>
  <rect x="3" y="3" width="44" height="44" fill="#D6D3D1" stroke="#E7E5E4" stroke-width="2"/>
  <g><g transform="translate(16 16) scale(0.75)" fill="#1C1917"><path d="M11 5H5v2h6V5ZM5 7H3v12h2V7Zm12 12H5v2h12v-2Zm2-6h-2v6h2v-6Zm-8 0H9v2h2v-2Zm2-2h-2v2h2v-2Zm2-2h-2v2h2V9Zm2-2h-2v2h2V7Zm2-2h-2v2h2V5Zm2-2h-2v8h2V3Z"/><path d="M21 3h-8v2h8V3Z"/></g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;2 -2;0 0" keyTimes="0;0.6;0.8;1" dur="2s" repeatCount="indefinite"/></g>
  <text x="61" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="700" font-size="9.5" letter-spacing="1.6" fill="#E7E5E4" text-anchor="start">VIEW ALL MISSION RECORDS</text>
  <text x="61" y="37" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="400" font-size="8.5" letter-spacing="0.6" fill="#A8A29E" text-anchor="start">al.is-a.dev/work</text>
</svg>
