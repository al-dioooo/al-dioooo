  <text x="53" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="700" font-size="8" letter-spacing="1.4" fill="#E7E5E4" text-anchor="start">EMAIL</text>
  <text x="53" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="400" font-size="8.2" letter-spacing="0" fill="#D6D3D1" text-anchor="start">contact@al.is-a.dev</text>
  <g><g transform="translate(145 9) scale(0.38)" fill="#A8A29E"><path d="M11 5H5v2h6V5ZM5 7H3v12h2V7Zm12 12H5v2h12v-2Zm2-6h-2v6h2v-6Zm-8 0H9v2h2v-2Zm2-2h-2v2h2v-2Zm2-2h-2v2h2V9Zm2-2h-2v2h2V7Zm2-2h-2v2h2V5Zm2-2h-2v8h2V3Z"/><path d="M21 3h-8v2h8V3Z"/></g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;1.5 -1.5;0 0" keyTimes="0;0.7;0.85;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></g>
